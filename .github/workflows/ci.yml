name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, unit + PostGIS integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        # The same image as docker-compose.yml.
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: stats19
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: stats19_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stats19"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STATS19_TEST_DATABASE_URL: postgresql://stats19:ci@localhost:5432/stats19_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Install Chromium for the PDF tests
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Test
        run: uv run pytest --cov=stats19 --cov-report=term
      - name: Coverage summary
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web (tests, lint, format, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same major version as docker/web.Dockerfile.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - name: Type-check and build
        run: npm run build
