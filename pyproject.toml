[project]
name = "stats19"
version = "0.1.0"
description = "UK road collision data platform: automated STATS19 ETL into PostGIS, statistical safety models and an API for a road-safety web app"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "psycopg-pool>=3.3.3",
    "playwright>=1.63.0",
    "xlsxwriter>=3.2.9",
    "osmium>=4.0",
    "statsmodels>=0.14",
    "scipy>=1.11",  # Poisson intervals for small-count rates (V4)
    "pyjwt[crypto]>=2.9",  # Cloudflare Access JWT check at the origin (PLAN-006 C3)
]

[project.scripts]
stats19 = "stats19.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stats19"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running PostGIS database (STATS19_TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["stats19"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
